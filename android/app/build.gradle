plugins {
    id "com.android.application"
}

android {
    namespace "dev.lab.openscan"
    compileSdk 34
    ndkVersion "28.2.13676358"

    defaultConfig {
        applicationId "dev.lab.openscan"
        minSdk 26
        targetSdk 34
        versionCode 14
        versionName "0.6.14"
        ndk {
            abiFilters "arm64-v8a", "armeabi-v7a", "x86_64"
        }
        externalNativeBuild {
            cmake {
                cFlags "-std=c11 -Wall -Wextra"
                arguments "-DANDROID_STL=none"
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    externalNativeBuild {
        cmake {
            path "src/main/c/CMakeLists.txt"
            version "3.22.1"
        }
    }

}
