plugins {
    id "com.android.application"
}

android {
    namespace "dev.lab.openscan"
    compileSdk 34
    ndkVersion "28.2.13676358"

    defaultConfig {
        applicationId "dev.lab.openscan"
        minSdk 26
        targetSdk 34
        versionCode 13
        versionName "0.6.13"
        ndk {
            abiFilters "arm64-v8a", "armeabi-v7a", "x86_64"
        }
        externalNativeBuild {
            cmake {
                cppFlags "-std=c++17 -Wall -Wextra -frtti -fexceptions"
                arguments "-DANDROID_STL=c++_shared"
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
            version "3.22.1"
        }
    }

    sourceSets {
        main {
            assets.srcDirs += [file("${rootProject.projectDir}/../calib")]
        }
    }

}
